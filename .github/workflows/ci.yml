name: CI
on:
  push:
    branches: [main, e2e-run1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run tests
        run: ./gradlew test --console=plain --no-daemon
